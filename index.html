<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Noodle Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800;900&display=swap" rel="stylesheet">
    <style>
        /* --- CSS (Exactly from your provided code) --- */
        :root { --bg: #f0f2f5; --surface: #ffffff; --text: #2d3436; --primary: #0984e3; --success: #00b894; --danger: #d63031; --warning: #fdcb6e; }
        body { font-family: 'Nunito', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; margin: 0; user-select: none; transition: background 0.5s; }
        .game-container { width: 100%; max-width: 950px; text-align: center; transition: all 0.5s; }
        h1 { font-weight: 900; margin: 0 0 20px 0; font-size: 2.5rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }

        .glass-panel { background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .wallet-display { font-size: 2rem; font-weight: 900; color: #2ecc71; }
        .stats-box { text-align: right; background: rgba(0,0,0,0.03); padding: 10px 15px; border-radius: 12px; }

        .tab-nav { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 1.1rem; font-family: 'Nunito', sans-serif; font-weight: 800; border: none; border-radius: 12px; background: rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; color: var(--text); }
        .tab-btn:hover { background: rgba(0,0,0,0.1); transform: translateY(-2px); }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(9, 132, 227, 0.4); }
        .view-panel { display: none; height: 550px; overflow-y: auto; border-radius: 12px; position: relative; animation: fadeIn 0.3s ease-in-out; }
        .view-panel.active-view { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .pantry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .ing-item { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; font-weight: bold; gap: 8px;}
        .ing-item button { width: 100%; background: var(--success); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; padding: 6px; transition: 0.2s;}
        .ing-item button:hover { filter: brightness(1.1); transform: scale(1.05); }
        .ing-item button:disabled { background: #555; cursor: default; }

        .pad-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 20px;}
        .tycoon-pad { background: var(--danger); border: none; color: white; padding: 15px 10px; font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 800; cursor: pointer; border-radius: 12px; transition: 0.2s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .tycoon-pad.affordable { background: var(--success); color: white; }
        .tycoon-pad:active { transform: translateY(6px); box-shadow: 0 0px 0 transparent; }

        .rival-card { background: rgba(0,0,0,0.05); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .rival-info { text-align: left; }
        .hp-bar-bg { width: 200px; height: 10px; background: #dfe6e9; border-radius: 5px; overflow: hidden; margin-top: 5px;}
        .hp-bar-fill { height: 100%; background: #ff7675; width: 100%; transition: width 0.3s; }

        #admin-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0a0a; padding: 40px; border-radius: 15px; border: 2px solid #00ff00; z-index: 10000; text-align: center; box-shadow: 0 0 30px rgba(0,255,0,0.2); }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px; }
        .god-btn { background: transparent; color: #00ff00; border: 1px solid #00ff00; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .god-btn:hover { background: #00ff00; color: #000; }
        .hidden { display: none !important; }

        .theme-neon { --bg: #0f0f15; --surface: #1e1e28; --text: #fff; }
        .theme-zen { --bg: #e2e8f0; --surface: #f8fafc; }
        .theme-gold { --bg: #fef08a; --surface: #fffbeb; }

        #dining-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px;}
        .seat { width: 70px; height: 100px; background: #f1f2f6; border-radius: 10px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; cursor: pointer; box-shadow: inset 0 -10px 0 rgba(0,0,0,0.05); }
        .seat:active { transform: scale(0.95); }
        .seat.locked { display: none !important; }
        .belt-strip { height: 12px; width: 100%; background: #2d3436; position: absolute; bottom: 0; left: 0; border-radius: 0 0 10px 10px; z-index: 2; }
        .status-text { position: absolute; top: 2px; width: 100%; text-align: center; font-size: 0.75rem; font-weight: 900; z-index: 10; }
        
        .menu-request, .serve-request { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: white; border-radius: 8px; padding: 2px 6px; font-size: 1.2rem; font-weight: bold; animation: bounce 0.5s infinite alternate; z-index: 20; color: black; }
        .pay-request { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); background: #55efc4; border-radius: 50%; width: 30px; height: 30px; line-height: 30px; font-weight: 900; color: #000; animation: bounce 0.4s infinite alternate; z-index: 30; }
        .patience-container { position: absolute; bottom: -12px; left: 10%; width: 80%; height: 6px; background: #eee; border-radius: 4px; overflow: hidden; z-index: 20; }
        .patience-fill { height: 100%; transition: width 0.1s linear; }

        .customer-wrapper { position: absolute; bottom: 12px; width: 100%; display: flex; justify-content: center; pointer-events: none; z-index: 5;}
        .rpg-char { display: flex; flex-direction: column; align-items: center; width: 30px; position: relative; z-index: 10; transform-origin: bottom center;}
        .rpg-head { width: 18px; height: 18px; background: var(--skin); border: 2px solid rgba(0,0,0,0.5); border-radius: 4px; position: relative; z-index: 3; }
        .rpg-hair { width: 22px; height: 8px; background: var(--hair); position: absolute; top: -8px; left: -2px; border-radius: 4px 4px 0 0; z-index: 4; }
        .rpg-eyes { display: flex; justify-content: space-between; width: 10px; margin: 4px auto 0; }
        .rpg-eye { width: 3px; height: 3px; background: #000; border-radius: 50%;}
        .rpg-body { width: 16px; height: 14px; background: var(--shirt); border: 2px solid rgba(0,0,0,0.5); border-top: none; position: relative; z-index: 2; margin-top: -2px;}
        .rpg-legs { display: flex; gap: 2px; margin-top: -2px; z-index: 1; }
        .rpg-leg { width: 6px; height: 10px; background: var(--pants); border: 2px solid rgba(0,0,0,0.5); border-top: none; transform-origin: top center; }

        @keyframes bounce { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-5px); } }

        #stoves-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom:20px; }
        .stove-station { width: 100px; height: 100px; background: #dfe6e9; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; box-shadow: 0 5px 0 #b2bec3; }
        .stove-station:active { transform: translateY(5px); box-shadow: 0 0px 0 transparent; }
        .stove-burner { width: 80%; height: 20px; background: #ff7675; border-radius: 50%; position: absolute; bottom: 10px; opacity: 0.5; box-shadow: 0 0 15px #ff7675;}
        .manual-bowl { width: 60px; height: 40px; border-radius: 5px 5px 30px 30px; border: 3px solid #2d3436; position: relative; z-index: 5;}
        .step-0 { background: #fff; } .step-1 { background: #74b9ff; } .step-2 { background: #e17055; } .step-3 { background: #f1c40f; }
        .stove-label { position: absolute; top: -15px; background: #fff; color: #000; border-radius: 5px; padding: 2px 5px; font-size: 0.7rem; font-weight: bold; z-index: 10;}
        .visual-chef { position: absolute; bottom: 10px; right: -15px; font-size: 1.8rem; z-index: 10; pointer-events: none; }

        .vip-char { filter: drop-shadow(0px 0px 8px gold); transform: scale(1.15); }
        .vip-crown { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; z-index: 20; }

        /* Map Styles */
        #map-area { width: 100%; max-width: 600px; height: 400px; background-color: #2c3e50; position: relative; border: 4px solid #fff; margin: 20px auto; overflow: hidden; border-radius: 12px;}
        #player-character { width: 30px; height: 30px; background-color: #e74c3c; position: absolute; top: 50px; left: 50px; border-radius: 5px; z-index: 100; box-shadow: 0 0 10px rgba(0,0,0,0.5);}
        .map-instructions { text-align: center; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="main-container" class="game-container theme-default">
    <h1>🍜 Monkey Noodle Mart 🐒</h1>
    
    <div class="glass-panel top-bar">
        <div class="wallet-display" id="money">$0</div>
        <div class="stats-box">
            ⭐ Monkey Money: <span id="stat-stars">0</span><br>
            🔥 Turf Mult: <span id="stat-turf">1.0</span>x<br>
            🍜 Current Menu: <span id="stat-menu">Basic Shoyu</span>
        </div>
    </div>

    <div id="out-of-stock-msg" class="hidden" style="color: var(--danger); font-weight: bold; margin-bottom: 10px;">⚠️ OUT OF STOCK! Buy ingredients!</div>

    <div class="tab-nav">
        <button id="btn-kitchen" class="tab-btn active" onclick="switchTab('kitchen')">Shop</button>
        <button id="btn-staff" class="tab-btn" onclick="switchTab('staff')">Staff</button>
        <button id="btn-decor" class="tab-btn" onclick="switchTab('decor')">Decor</button>
        <button id="btn-turf" class="tab-btn" onclick="switchTab('turf')">Rivals</button>
        <button id="btn-map" class="tab-btn" onclick="switchTab('map')">Map</button>
    </div>

    <div id="view-kitchen" class="view-panel active-view glass-panel">
        
        <div class="pantry-grid">
            <div class="ing-item">Noodles: <span id="inv-noodle">0</span><button onclick="buyIngredient('noodle', 10, 50)">Buy 10 ($50)</button></div>
            <div class="ing-item">Broth: <span id="inv-broth">0</span><button onclick="buyIngredient('broth', 10, 50)">Buy 10 ($50)</button></div>
            <div class="ing-item">Spice: <span id="inv-spice">0</span><button onclick="buyIngredient('spice', 10, 100)">Buy 10 ($100)</button></div>
            <div class="ing-item">Eggs: <span id="inv-egg">0</span><button onclick="buyIngredient('egg', 10, 150)">Buy 10 ($150)</button></div>
            <div class="ing-item">Boba: <span id="inv-boba">0</span><button onclick="buyIngredient('boba', 10, 200)">Buy 10 ($200)</button></div>
        </div>

        <button id="btn-auto-refill" onclick="buyAutoRefill()" style="margin-bottom: 20px; padding: 10px; border-radius: 8px; font-weight: bold;">Auto-Refill: OFF</button>

        <div style="display:flex; justify-content:center; gap: 10px; margin-bottom:10px;">
            <div id="wait-list" style="display:flex; gap:5px;"></div>
        </div>
        <div id="dining-area"></div>

        <div id="stoves-container"></div>

        <div class="pad-container" id="upgrades-container">
            <div id="pad-table"></div>
            <div id="pad-recipe"></div>
            <div id="pad-wok"></div>
            <div id="pad-auto"></div>
            <div id="pad-ads"></div>
        </div>
    </div>

    <div id="view-staff" class="view-panel glass-panel">
        <h2>Hire Helpers</h2>
        <div id="staff-container" class="pad-container"></div>
    </div>

    <div id="view-decor" class="view-panel glass-panel">
        <h2>Shop Themes</h2>
        <div id="decor-container" class="pad-container"></div>
    </div>

    <div id="view-turf" class="view-panel glass-panel">
        <h2>Rival Businesses</h2>
        <div id="turf-container"></div>
    </div>

    <div id="view-map" class="view-panel glass-panel">
        <h2>City Map</h2>
        <p class="map-instructions">Use <b>W A S D</b> or <b>Arrow Keys</b> to explore the area!</p>
        <div id="map-area">
            <div id="player-character"></div>
        </div>
    </div>
</div>

<div id="admin-panel" class="hidden">
    <h2 style="color:#00ff00; margin:0;">DEVELOPER CONSOLE</h2>
    <input type="number" id="custom-money" placeholder="Set Cash Amount" style="padding:5px; margin-top:10px;">
    <button class="god-btn" onclick="setCustomMoney()">Set</button>
    <div class="admin-grid">
        <button class="god-btn" onclick="cheatMoney(1000000)">+$1M Cash</button>
        <button class="god-btn" onclick="cheatStars()">+1 Monkey Money</button>
        <button class="god-btn" onclick="adminMaxIngredients()">Max Ingredients</button>
        <button class="god-btn" onclick="nukeRivals()">Defeat All Rivals</button>
        <button class="god-btn" onclick="adminMaxEverything()">MAX EVERYTHING</button>
        <button class="god-btn" onclick="document.getElementById('admin-panel').classList.add('hidden')">Close</button>
    </div>
</div>

<script>
// --- AUDIO SYSTEM ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if(type === 'cash') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    else if(type === 'cook') { osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    else if(type === 'serve') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    else if(type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
}

// --- FORMATTERS & VFX ---
const suffixes = ["", "k", "M", "B", "T", "Qa", "Qi", "Sx"];
function formatMoney(n) {
    if (n < 1000) return Math.floor(n).toString();
    let exponent = Math.floor(Math.log10(n)); let suffixNum = Math.floor(exponent / 3);
    if (suffixNum < suffixes.length) { return (n / Math.pow(10, suffixNum * 3)).toFixed(2) + suffixes[suffixNum]; }
    return n.toExponential(2);
}

function spawnFloatingMoney(amount, targetId, color = '#2ecc71') {
    let targetEl = document.getElementById(targetId);
    let floatText = document.createElement('div');
    floatText.innerText = typeof amount === 'number' ? `+$${formatMoney(amount)}` : amount;
    floatText.style.cssText = `position:absolute; color:${color}; font-weight:bold; font-size:1.2rem; pointer-events:none; z-index:100; animation:floatUp 1s ease-out forwards;`;
    
    if (targetEl) {
        let rect = targetEl.getBoundingClientRect();
        floatText.style.left = (rect.left + window.scrollX + 20) + 'px'; floatText.style.top = (rect.top + window.scrollY) + 'px';
    } else { floatText.style.left = '50%'; floatText.style.top = '50%'; }
    
    document.body.appendChild(floatText); setTimeout(() => floatText.remove(), 1000);
}

if (!document.getElementById('floating-money-style')) {
    let style = document.createElement('style');
    style.id = 'floating-money-style';
    style.innerHTML = `@keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }`;
    document.head.appendChild(style);
}

// --- GAME DATA ---
const TRACK_TABLES = Array.from({length: 100}, (_, i) => ({ name: `Table ${i+2}`, cost: Math.floor(150 * Math.pow(1.15, i)) }));
const TRACK_WOK = Array.from({length: 100}, (_, i) => ({ name: `Wok Lvl ${i+2}`, cost: Math.floor(100000 * Math.pow(1.15, i)) }));
const TRACK_AUTO = Array.from({length: 100}, (_, i) => ({ name: `Chef Speed ${i+1}`, cost: Math.floor(1500 * Math.pow(1.15, i)) }));
const TRACK_ADS = Array.from({length: 100}, (_, i) => ({ name: `Marketing ${i+1}`, cost: Math.floor(500 * Math.pow(1.15, i)) }));

const RAMEN_NAMES = ["Basic Shoyu", "Miso Pork", "Spicy Tonkotsu", "Chicken Paitan", "Seafood Ramen", "Veggie Udon"];
const TRACK_RECIPES = Array.from({length: 100}, (_, i) => {
    let name = i < RAMEN_NAMES.length ? RAMEN_NAMES[i] : `Epic Ramen ${i}`;
    return { name, cost: Math.floor(400 * Math.pow(1.04, i)), value: Math.floor(100 * Math.pow(1.035, i)) };
});

const TRACK_DECOR = [ { id: 'theme-default', name: 'Standard Store', cost: 0 }, { id: 'theme-neon', name: 'Cyberpunk Neon', cost: 500000 }, { id: 'theme-zen', name: 'Zen Garden', cost: 10000000 }, { id: 'theme-gold', name: 'Solid Gold Palace', cost: 1000000000 } ];
const TRACK_STAFF = [ { id: 'waiter', name: 'Waiter Chimp (Auto)', baseCost: 50000, mult: 5 }, { id: 'ninja', name: 'Ninja Macaque', baseCost: 250000, mult: 10 }, { id: 'mascot', name: 'Capuchin Mascot', baseCost: 1000000, mult: 15 } ];
const INITIAL_RIVALS = [ { id: 'sushi', name: '🍣 Sushi Pandas', hp: 50000, maxHp: 50000, cost: 5000, multReward: 0.5 }, { id: 'burger', name: '🍔 Burger Bears', hp: 1000000, maxHp: 1000000, cost: 50000, multReward: 1.0 } ];

let defaultInv = { noodle: 10, broth: 10, spice: 10, egg: 10, boba: 10 };
let game = { wallet: 150, monkeyMoney: 0, turfMult: 1, tablesOwned: 1, idxTable: 0, idxRecipe: 0, idxWok: 0, idxAuto: 0, idxAds: 0, currentMenuPrice: 50, activeDecor: 'theme-default', decorOwned: ['theme-default'], autoRefill: false, staff: { waiter: 0, ninja: 0, mascot: 0 }, rivals: JSON.parse(JSON.stringify(INITIAL_RIVALS)), inv: { ...defaultInv } };

// --- CHARACTERS ---
const charColors = { skin: ["#ffdbac", "#f1c27d", "#e0ac69", "#8d5524"], hair: ["#090806", "#4a2511", "#b7a69e"], shirt: ["#e74c3c", "#3498db", "#2ecc71"], pants: ["#2980b9", "#2c3e50"] };
function generateRandomChar() { return { skin: charColors.skin[Math.floor(Math.random()*4)], hair: charColors.hair[Math.floor(Math.random()*3)], shirt: charColors.shirt[Math.floor(Math.random()*3)], pants: charColors.pants[Math.floor(Math.random()*2)], isVIP: Math.random() < 0.05, isCritic: false, wantsBoba: Math.random() < 0.2 }; }

function renderCharHTML(c) { 
    let crown = c.isVIP ? `<div class="vip-crown">👑</div>` : ''; 
    return `<div class="rpg-char${c.isVIP?' vip-char':''}" style="--skin:${c.skin}; --hair:${c.hair}; --shirt:${c.isVIP?'#f1c40f':c.shirt}; --pants:${c.pants};">${crown}<div class="rpg-head"><div class="rpg-hair"></div><div class="rpg-eyes"><div class="rpg-eye"></div><div class="rpg-eye"></div></div></div><div class="rpg-body"></div><div class="rpg-legs"><div class="rpg-leg"></div><div class="rpg-leg"></div></div></div>`; 
}

let seats = Array.from({length: 100}, () => ({ occupied: false, needsMenu: false, isCooking: false, cookStep: 0, needsServing: false, needsToPay: false, patience: 100, charData: null }));
let waitList = []; let isRushHour = false; let rushMultiplier = 1;

// --- CORE LOGIC ---
function switchTab(tab) { 
    document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active-view')); 
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); 
    document.getElementById(`view-${tab}`).classList.add('active-view'); 
    document.getElementById(`btn-${tab}`).classList.add('active'); 
    if(tab==='decor') renderDecorPanel(); if(tab==='staff') renderStaffPanel(); if(tab==='turf') renderTurfPanel(); 
}

function initTables() { 
    let d = document.getElementById('dining-area'); 
    for(let i=0; i<100; i++) { let div = document.createElement('div'); div.id = `seat-${i}`; div.className = 'seat locked'; d.appendChild(div); } 
}

function getPrestigeMultiplier() { return (1 + (game.monkeyMoney * 2)) * game.turfMult; }

function customerArrives() { 
    if (waitList.length < 10) { waitList.push(generateRandomChar()); renderWaitList(); } 
    checkEmptySeats(); 
    let speed = Math.max(200, 2500 * Math.pow(0.90, game.idxAds || 0)); 
    setTimeout(customerArrives, speed); 
}
function renderWaitList() { document.getElementById('wait-list').innerHTML = waitList.map(char => `<div style="margin-bottom:5px;">${renderCharHTML(char)}</div>`).join(''); }

function checkEmptySeats() {
    if (waitList.length === 0) return;
    for (let i = 0; i < game.tablesOwned; i++) { if (!seats[i].occupied) { const char = waitList.shift(); renderWaitList(); spawnWalkingCustomer(i, char); break; } }
}

function spawnWalkingCustomer(seatIdx, char) {
    seats[seatIdx].occupied = true; seats[seatIdx].patience = 100; updateUI();
    setTimeout(() => { seats[seatIdx].charData = char; seats[seatIdx].needsMenu = true; updateUI(); }, 1000);
}

function handleTableClick(index) {
    let seat = seats[index]; if (!seat.occupied) return;
    if (seat.needsMenu) { seat.needsMenu = false; seat.patience = 100; updateUI(); } 
    else if (seat.needsServing) { 
        if(seat.charData.wantsBoba) { if(game.inv.boba < 1) { document.getElementById('out-of-stock-msg').classList.remove('hidden'); playSound('error'); return; } game.inv.boba--; }
        seat.needsServing = false; seat.needsToPay = true; seat.patience = 100; playSound('serve'); updateUI(); 
    } 
    else if (seat.needsToPay) collectPayment(index); 
    else if (!seat.isCooking) { seat.isCooking = true; seat.cookStep = 0; seat.patience = 100; updateUI(); updateKitchenUI(); }
}

function collectPayment(index) {
    let seat = seats[index]; let mult = seat.charData.isVIP ? 10 : 1;
    let finalValue = (game.currentMenuPrice * mult) * getPrestigeMultiplier();
    game.wallet += finalValue; playSound('cash'); spawnFloatingMoney(finalValue, `seat-${index}`);
    seat.occupied = false; seat.charData = null; seat.needsMenu = false; seat.isCooking = false; seat.cookStep = 0; seat.needsServing = false; seat.needsToPay = false; seat.patience = 100;
    updateUI();
}

function buyIngredient(type, amount, cost) { 
    if (game.wallet >= cost) { game.wallet -= cost; game.inv[type] += amount; document.getElementById('out-of-stock-msg').classList.add('hidden'); playSound('cook'); updateUI(); } 
    else playSound('error'); 
}
function buyAutoRefill() { if (game.wallet >= 50000 && !game.autoRefill) { game.wallet -= 50000; game.autoRefill = true; playSound('cash'); updateUI(); } }

// --- BACKGROUND LOOPS ---
setInterval(() => {
    if (game.autoRefill) {
        let cost = 50; let didRefill = false;
        ['noodle', 'broth', 'spice', 'egg', 'boba'].forEach(item => {
            if (game.inv[item] <= 10 && game.wallet >= cost) { game.inv[item] += 100; game.wallet -= cost; didRefill = true; }
        });
        if (didRefill) { updateUI(); updateKitchenUI(); }
    }
}, 1000);

setInterval(() => {
    let uiNeedsUpdate = false; let drainRate = Math.max(1, 5 - (game.staff.mascot * 0.4)); 
    for (let i = 0; i < game.tablesOwned; i++) {
        let seat = seats[i];
        if (seat.occupied && seat.charData) {
            seat.patience -= drainRate; uiNeedsUpdate = true;
            if (seat.patience <= 0) {
                playSound('error'); spawnFloatingMoney("😡 WALKOUT!", `seat-${i}`, '#e74c3c');
                seat.occupied = false; seat.charData = null; seat.needsMenu = false; seat.isCooking = false; seat.needsServing = false; seat.needsToPay = false; updateKitchenUI();
            }
        }
    }
    if (uiNeedsUpdate) updateUI();
}, 1000);

function clickStove(index) {
    let seat = seats[index]; if (!seat.isCooking) return;
    let msg = document.getElementById('out-of-stock-msg');
    
    if(seat.cookStep === 0 && game.staff.ninja > 0 && Math.random() < (game.staff.ninja * 0.05)) {
        if(game.inv.noodle<1||game.inv.broth<1||game.inv.spice<1||game.inv.egg<1) { msg.classList.remove('hidden'); return; }
        game.inv.noodle--; game.inv.broth--; game.inv.spice--; game.inv.egg--; seat.cookStep = 3; finishCooking(index); return;
    }

    if (seat.cookStep === 0) { if (game.inv.noodle < 1 || game.inv.broth < 1) { msg.classList.remove('hidden'); return; } game.inv.noodle--; game.inv.broth--; playSound('cook'); seat.cookStep = 1; } 
    else if (seat.cookStep === 1) { if (game.inv.spice < 1) { msg.classList.remove('hidden'); return; } game.inv.spice--; playSound('cook'); seat.cookStep = 2; } 
    else if (seat.cookStep === 2) { if (game.inv.egg < 1) { msg.classList.remove('hidden'); return; } game.inv.egg--; playSound('cook'); seat.cookStep = 3; finishCooking(index); return; }
    updateUI(); updateKitchenUI();
}

function finishCooking(index) {
    let seat = seats[index];
    setTimeout(() => { seat.isCooking = false; seat.needsServing = true; seat.patience = 100; updateUI(); updateKitchenUI(); }, 400);
}

function runMonkeyLoop() {
    if (game.staff.waiter > 0) {
        for (let i = 0; i < game.tablesOwned; i++) {
            let s = seats[i]; if (!s.occupied || s.charData === null) continue;
            if (s.needsMenu || s.needsServing || s.needsToPay) { 
                if (s.needsServing && s.charData.wantsBoba && game.inv.boba < 1) continue; 
                handleTableClick(i); break; 
            }
        }
    }
    setTimeout(runMonkeyLoop, Math.max(50, 3000 * Math.pow(0.85, game.idxAuto)));
}

// --- UPGRADES ---
function buyTable() { let u = TRACK_TABLES[game.idxTable]; if (u && game.wallet >= u.cost) { game.wallet -= u.cost; game.tablesOwned++; game.idxTable++; playSound('cash'); updateUI(); updateKitchenUI(); } }
function buyRecipe() { let u = TRACK_RECIPES[game.idxRecipe]; if (u && game.wallet >= u.cost) { game.wallet -= u.cost; game.currentMenuPrice = u.value; game.idxRecipe++; playSound('cash'); updateUI(); } }
function buyAuto() { let u = TRACK_AUTO[game.idxAuto]; if (u && game.wallet >= u.cost) { game.wallet -= u.cost; game.idxAuto++; playSound('cash'); updateUI(); updateKitchenUI(); } }
function buyWok() { let u = TRACK_WOK[game.idxWok]; if (u && game.wallet >= u.cost) { game.wallet -= u.cost; game.idxWok++; playSound('cash'); updateUI(); } }
function buyAds() { let u = TRACK_ADS[game.idxAds]; if (u && game.wallet >= u.cost) { game.wallet -= u.cost; game.idxAds++; playSound('cash'); updateUI(); } }

function renderPad(id, track, idx, func, title) {
    let container = document.getElementById(id); if(!container) return; let u = track[idx];
    if (!u) { container.innerHTML = `<button class="tycoon-pad" style="background:#333;">${title}<br>MAX LEVEL</button>`; } 
    else { let afford = game.wallet >= u.cost ? "affordable" : ""; container.innerHTML = `<button class="tycoon-pad ${afford}" onclick="${func}()"><b>${title}</b><br>Lvl ${idx+1}: ${u.name}<br>$${formatMoney(u.cost)}</button>`; }
}

function updateUI() {
    document.getElementById('money').innerText = "$" + formatMoney(game.wallet);
    document.getElementById('inv-noodle').innerText = formatMoney(game.inv.noodle); 
    document.getElementById('inv-broth').innerText = formatMoney(game.inv.broth);
    document.getElementById('inv-spice').innerText = formatMoney(game.inv.spice); 
    document.getElementById('inv-egg').innerText = formatMoney(game.inv.egg);
    document.getElementById('inv-boba').innerText = formatMoney(game.inv.boba);
    
    let autoBtn = document.getElementById('btn-auto-refill');
    if(autoBtn) { if(game.autoRefill) { autoBtn.innerText = "ACTIVE"; autoBtn.disabled = true; } else { autoBtn.innerText = "Buy Auto-Refill ($50k)"; autoBtn.disabled = false; } }

    document.getElementById('stat-stars').innerText = game.monkeyMoney; 
    document.getElementById('stat-turf').innerText = game.turfMult.toFixed(1);
    document.getElementById('stat-menu').innerText = `${game.idxRecipe > 0 ? TRACK_RECIPES[game.idxRecipe-1].name : RAMEN_NAMES[0]} ($${formatMoney(game.currentMenuPrice)})`;

    seats.forEach((seat, i) => {
        let el = document.getElementById(`seat-${i}`); if (!el) return;
        if (i >= game.tablesOwned) { el.classList.add('locked'); return; } else el.classList.remove('locked');
        let html = "";
        if (seat.occupied && seat.charData) {
            if (seat.needsMenu) html += `<div class="menu-request">📜?</div>`;
            if (seat.needsServing) html += `<div class="serve-request">🍜</div>`;
            if (seat.needsToPay && !seat.needsServing) html += `<div class="pay-request">$</div>`;
            html += `<div class="patience-container"><div id="patience-bar-${i}" class="patience-fill" style="width:${seat.patience}%; background-color:${seat.patience < 30 ? '#d63031' : '#00b894'}"></div></div>`;
            html += `<div class="customer-wrapper">${renderCharHTML(seat.charData)}</div>`;
        } else { html += `<span class="status-text" style="color:#aaa;">Empty</span>`; }
        html += `<div class="belt-strip"></div>`; el.innerHTML = html; el.onclick = () => handleTableClick(i);
    });

    renderPad('pad-table', TRACK_TABLES, game.idxTable, 'buyTable', '🪑 TABLES'); 
    renderPad('pad-recipe', TRACK_RECIPES, game.idxRecipe, 'buyRecipe', '🍲 RECIPES');
    renderPad('pad-wok', TRACK_WOK, game.idxWok, 'buyWok', '🍳 WOK'); 
    renderPad('pad-auto', TRACK_AUTO, game.idxAuto, 'buyAuto', '🐒 MAIN CHEF');
    renderPad('pad-ads', TRACK_ADS, game.idxAds, 'buyAds', '📺 ADVERTISE');
}

function updateKitchenUI() {
    let container = document.getElementById('stoves-container'); if(!container) return; container.innerHTML = ""; 
    seats.forEach((seat, i) => {
        if (seat.occupied && seat.isCooking) {
            let stove = document.createElement('div'); stove.className = "stove-station"; stove.onclick = () => clickStove(i);
            stove.innerHTML = `<div class="stove-label">Step ${seat.cookStep+1}</div><div class="manual-bowl step-${seat.cookStep}"></div><div class="stove-burner"></div>${game.idxAuto > 0 ? `<div class="visual-chef">🐒</div>` : ''}`;
            container.appendChild(stove);
        }
    });
}

function buyStaff(id, cost) { if(game.wallet >= cost) { game.wallet -= cost; game.staff[id]++; playSound('cash'); updateUI(); renderStaffPanel(); } }
function renderStaffPanel() {
    let html = "";
    TRACK_STAFF.forEach(s => {
        let cost = s.baseCost * Math.pow(s.mult, game.staff[s.id]);
        html += `<button class="tycoon-pad ${game.wallet >= cost ? 'affordable' : ''}" onclick="buyStaff('${s.id}', ${cost})"><b>${s.name}</b><br>Hired: ${game.staff[s.id]}<br>$${formatMoney(cost)}</button>`;
    });
    document.getElementById('staff-container').innerHTML = html;
}

function attackRival(idx) {
    let rival = game.rivals[idx];
    if(rival.hp > 0 && game.wallet >= rival.cost) {
        game.wallet -= rival.cost; rival.hp -= Math.max(1, rival.maxHp * 0.1); playSound('cook');
        if(rival.hp <= 0) { rival.hp = 0; game.turfMult += rival.multReward; playSound('cash'); alert(`DEFEATED ${rival.name}! Multiplier +${rival.multReward}x!`); }
        updateUI(); renderTurfPanel();
    }
}
function renderTurfPanel() {
    let html = "";
    game.rivals.forEach((r, i) => {
        if(r.hp <= 0) html += `<div class="rival-card" style="opacity:0.5;"><h3>${r.name} (DEFEATED)</h3><span>+${r.multReward}x Multiplier Active</span></div>`;
        else html += `<div class="rival-card"><div class="rival-info"><h3>${r.name}</h3><div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${(r.hp / r.maxHp) * 100}%"></div></div></div><button class="tycoon-pad ${game.wallet >= r.cost ? 'affordable' : ''}" onclick="attackRival(${i})">Launch Campaign<br>$${formatMoney(r.cost)}</button></div>`;
    });
    document.getElementById('turf-container').innerHTML = html;
}

function buyDecor(id, cost) { 
    if(game.decorOwned.includes(id)) { game.activeDecor = id; document.getElementById('main-container').className = "game-container " + id; renderDecorPanel(); } 
    else if(game.wallet >= cost) { game.wallet -= cost; game.decorOwned.push(id); game.activeDecor = id; document.getElementById('main-container').className = "game-container " + id; playSound('cash'); updateUI(); renderDecorPanel(); } 
}
function renderDecorPanel() { 
    let html = ""; 
    TRACK_DECOR.forEach(d => { 
        let isActive = game.activeDecor === d.id; 
        html += `<button class="tycoon-pad ${game.wallet >= d.cost || game.decorOwned.includes(d.id) ? 'affordable' : ''} ${isActive?'active':''}" style="margin:5px;" onclick="buyDecor('${d.id}', ${d.cost})"><b>${d.name}</b><br>${isActive ? "EQUIPPED" : (game.decorOwned.includes(d.id) ? "EQUIP" : `$${formatMoney(d.cost)}`)}</button>`; 
    }); 
    document.getElementById('decor-container').innerHTML = html; 
}

// --- ADMIN & CHEATS ---
let typed = ""; document.addEventListener('keydown', (e) => { typed += e.key.toLowerCase(); if (typed.endsWith("???")) { document.getElementById('admin-panel').classList.remove('hidden'); typed = ""; } });
function cheatMoney(amt) { game.wallet += amt; updateUI(); }
function setCustomMoney() { let val = parseFloat(document.getElementById('custom-money').value); if(!isNaN(val)) { game.wallet = val; updateUI(); } }
function adminMaxIngredients() { game.inv.noodle=1e6; game.inv.broth=1e6; game.inv.spice=1e6; game.inv.egg=1e6; game.inv.boba=1e6; document.getElementById('out-of-stock-msg').classList.add('hidden'); updateUI(); }
function cheatStars() { game.monkeyMoney++; updateUI(); }
function nukeRivals() { game.rivals.forEach(r => { if(r.hp > 0) { r.hp = 0; game.turfMult += r.multReward; }}); renderTurfPanel(); updateUI(); }
function adminMaxEverything() {
    game.wallet = 1e20; game.monkeyMoney = 1e9; game.tablesOwned = 100; game.idxTable = 99; game.idxRecipe = 99; game.idxWok = 99; game.idxAuto = 99; game.idxAds = 99;
    game.inv = { noodle: 1e10, broth: 1e10, spice: 1e10, egg: 1e10, boba: 1e10 };
    game.staff = { waiter: 100, ninja: 100, mascot: 100 };
    document.getElementById('out-of-stock-msg').classList.add('hidden'); updateUI(); alert("Maxed out!");
}

// --- WORLD MAP MOVEMENT SYSTEM (WASD / Arrows) ---
let playerX = 50; let playerY = 50; const playerSpeed = 4; const keys = {};
window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function gameLoop() {
    const mapTab = document.getElementById('view-map');
    if (mapTab && mapTab.classList.contains('active-view')) {
        const player = document.getElementById('player-character');
        const mapArea = document.getElementById('map-area');
        if (player && mapArea) {
            if (keys['w'] || keys['arrowup']) playerY -= playerSpeed;
            if (keys['s'] || keys['arrowdown']) playerY += playerSpeed;
            if (keys['a'] || keys['arrowleft']) playerX -= playerSpeed;
            if (keys['d'] || keys['arrowright']) playerX += playerSpeed;

            const maxX = mapArea.offsetWidth - player.offsetWidth - 8; 
            const maxY = mapArea.offsetHeight - player.offsetHeight - 8;
            playerX = Math.max(0, Math.min(playerX, maxX)); playerY = Math.max(0, Math.min(playerY, maxY));
            player.style.left = playerX + 'px'; player.style.top = playerY + 'px';
        }
    }
    requestAnimationFrame(gameLoop);
}

// Boot Sequence
initTables(); updateUI(); customerArrives(); runMonkeyLoop(); requestAnimationFrame(gameLoop);
</script>
</body>
</html>
